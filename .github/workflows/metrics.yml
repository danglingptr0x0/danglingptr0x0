name: Metrics
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    if: "github.repository == 'danglingptr0x0/danglingptr0x0'"
    steps:

      - name: Classic template
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.classic.svg
          token: ${{ secrets.GH_TOKEN }}
          base: header, repositories, activity
          base_indepth: yes
          plugin_lines: yes
          plugins_errors_fatal: no
          output_action: commit

      - name: Achievements
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.achievements.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_only: ""
          plugin_achievements_limit: 20
          plugins_errors_fatal: no
          output_action: commit

      - name: Activity plugin
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.activity.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 7
          plugin_activity_days: 0
          plugin_activity_filter: issue, pr, release, fork, review, ref/create
          plugins_errors_fatal: no
          output_action: commit

      - name: Anilist plugin (complete)
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.anilist.full.svg
          token: NOT_NEEDED
          plugin_anilist: yes
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, watching, characters
          plugin_anilist_limit: 3
          plugin_anilist_user: fluffy1011
          plugin_anilist_shuffle: yes
          plugins_errors_fatal: no
          output_action: commit

      - name: Follow-up plugin
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.followup.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_followup: yes
          plugin_followup_indepth: yes
          plugins_errors_fatal: no
          output_action: commit

      - name: Follow-up plugin (user)
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.followup.user.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_indepth: yes
          plugins_errors_fatal: no
          output_action: commit

      - name: Gists plugin
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.gists.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_gists: yes
          plugins_errors_fatal: no
          output_action: commit

      - name: Habits plugin
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.habits.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugins_errors_fatal: no
          config_timezone: Europe/Paris
          output_action: commit

      - name: Isocalendar plugin (full year)
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: no
          output_action: commit

      - name: Languages plugin (detailed)
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.languages.details.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, gnuplot, alloy
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 7
          plugin_languages_indepth: yes
          plugins_errors_fatal: no
          output_action: commit

      - name: Music plugin (recent)
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.music.recent.svg
          token: NOT_NEEDED
          plugin_music: yes
          plugin_music_provider: lastfm
          plugin_music_mode: top, recent
          plugin_music_token: ${{ secrets.LASTFM_KEY }}
          plugin_music_limit: 25
          plugin_music_played_at: yes
          plugin_music_top_type: artists
          plugin_music_time_range: long
          plugin_music_user: simtoon1011
          plugins_errors_fatal: no
          output_action: commit

      - name: People plugin
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.people.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_people: yes
          plugins_errors_fatal: no
          output_action: commit

      - name: Reactions plugin
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.reactions.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage
          plugins_errors_fatal: no
          output_action: commit

      - name: Stars plugin
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.stars.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 5
          plugins_errors_fatal: no
          output_action: commit

      - name: Code snippet of the day
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.code.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_code: yes
          plugin_code_languages: python, c++, javascript, c, bash
          plugin_code_visibility: public
          plugin_code_load: 500
          plugins_errors_fatal: no
          output_action: commit

      - name: Recently played games
        if: ${{ success() || failure() }}
        uses: danglingptr0x0/metrics@master
        with:
          filename: metrics.plugin.steam.svg
          token: NOT_NEEDED
          base: ""
          plugin_steam_token: ${{ secrets.STEAM_API_KEY }}
          plugin_steam: yes
          plugin_steam_user: ${{ secrets.STEAM_ID }}
          plugin_steam_sections: recently-played, most-played
          plugin_steam_achievements_limit: 0
          plugins_errors_fatal: no
          output_action: commit

      - name: Duolingo checkout
        if: ${{ success() || failure() }}
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Duolingo progress
        if: ${{ success() || failure() }}
        env:
          DUOLINGO_USERNAME: ${{ secrets.DUOLINGO_USERNAME }}
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.parse, urllib.request
          user = os.environ["DUOLINGO_USERNAME"].lstrip("@")
          req = urllib.request.Request("https://www.duolingo.com/2017-06-30/users?" + urllib.parse.urlencode({"username": user}), headers={"User-Agent": "Mozilla/5.0"})
          data = json.load(urllib.request.urlopen(req, timeout=30))["users"][0]
          rows = [("Streak", f"{data['streak']} days"), ("Total XP", str(data["totalXp"]))]
          rows += [(course["title"], f"{course['xp']} XP") for course in sorted(data["courses"], key=lambda course: course["xp"], reverse=True)]
          block = "Duolingo progress\n```text\n" + "".join(f"{name} {value}\n" for name, value in rows) + "```\n"
          with open("README.md", encoding="utf-8") as fh:
              text = fh.read()
          text = re.sub(r"(<!-- duolingo start -->\n).*?(<!-- duolingo end -->)", lambda match: match.group(1) + block + match.group(2), text, flags=re.S)
          with open("README.md", "w", encoding="utf-8") as fh:
              fh.write(text)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore(readme): update duolingo progress" && git pull --rebase && git push)
